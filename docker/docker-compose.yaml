version: "3"

services:
  limo:

    # -----------------------------------------------------
    # Build settings
    # -----------------------------------------------------
    build:
      context: ..
      dockerfile: docker/Dockerfile


    # -----------------------------------------------------
    # Image / Container
    # -----------------------------------------------------
    image: techshare/limo-pro:humble
    container_name: limo


    # -----------------------------------------------------
    # Network
    # -----------------------------------------------------
    network_mode: host


    # -----------------------------------------------------
    # Device access
    # -----------------------------------------------------
    privileged: true


    # -----------------------------------------------------
    # Volume mounts
    # -----------------------------------------------------
    volumes:

      # --- 必須 ---
      # デバイス共有（LiDAR等）
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb

      # GUI表示用（RViz / rqt など）
      - /tmp/.X11-unix:/tmp/.X11-unix

      # ---------------------------------------------------
      # Bind mount for development
      #
      # ・ ホスト側 ros2_ws をコンテナにマウント
      #
      # ・ bind mount は「コンテナ内の内容を上書きする」挙動になる
      #    ホスト側が空の場合、コンテナ内のファイルは見えなくなる
      #    ホスト側に ros2_ws を用意した状態で使用する
      #
      # ・ また、workspace全体をマウントすることで
      #    src / maps / rviz などを一括で共有する
      # ---------------------------------------------------
      - ../ros2_ws:/root/ros2_ws


    # ---------------------------------------------------
    # Environment variables
    # ---------------------------------------------------
    environment:

      # ROS2通信ID
      # 同じIDのノード同士のみ通信可能
      - ROS_DOMAIN_ID=1

      # GUI関連
      - DISPLAY=${DISPLAY}
      
      # OpenGLトラブル回避（ソフトウェア描画）
      - LIBGL_ALWAYS_SOFTWARE=1
      
      # Qt描画クラッシュ回避（Docker + X11対策）
      - QT_X11_NO_MITSHM=1
  
      # ---------------------------------------------------    
      # NVIDIA runtime (GPU用)
      # 有効化前提：
      #  - ホストに nvidia-container-toolkit が必要
      #  - docker info で "nvidia" runtime が見えること
      # ---------------------------------------------------
      # runtime: nvidia


    # ---------------------------------------------------
    # Keep terminal interactive
    # ---------------------------------------------------
    tty: true
    stdin_open: true
